<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03060d" />
<title>JARVIS — Your Personal AI Assistant</title>
<style>
  :root{
    --bg:#03060d;
    --cyan:#38e8ff;
    --cyan-dim:#1a7f96;
    --amber:#ffb648;
    --red:#ff5a6e;
    --text:#dff3fa;
    --muted:#6f8b98;
    --accent:var(--cyan);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
    overflow:hidden;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 18px 24px;
  }
  /* ---- ambient background ---- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg::before{
    content:'';position:absolute;inset:-30%;
    background:radial-gradient(circle at 50% 45%, rgba(56,232,255,.10), transparent 55%);
    animation:breathe 9s ease-in-out infinite;
  }
  .grid{
    position:absolute;inset:0;opacity:.16;
    background-image:linear-gradient(rgba(56,232,255,.10) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(56,232,255,.10) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 45%,#000 10%,transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 10%,transparent 72%);
  }
  .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);animation:scan 12s linear infinite}
  @keyframes scan{to{background-position-y:120px}}
  @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}

  /* ---- header ---- */
  header{position:relative;z-index:2;text-align:center;flex:0 0 auto}
  h1{
    margin:0;font-size:clamp(26px,7vw,46px);font-weight:200;letter-spacing:.62em;
    text-indent:.62em;color:#eafcff;
    text-shadow:0 0 24px rgba(56,232,255,.55),0 0 60px rgba(56,232,255,.22);
  }
  .tag{margin-top:9px;font-size:clamp(9px,2.4vw,11px);letter-spacing:.34em;color:var(--muted);text-transform:uppercase}

  /* ---- orb ---- */
  .stage{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0}
  .orbwrap{position:relative;width:min(60vw,300px);aspect-ratio:1;display:grid;place-items:center}
  canvas#orb{position:absolute;inset:0;width:100%;height:100%}
  .ring{
    position:absolute;border-radius:50%;border:1px solid rgba(56,232,255,.18);
    transition:border-color .5s ease;
  }
  .r1{inset:2%;animation:spin 26s linear infinite;border-style:dashed;border-color:rgba(56,232,255,.14)}
  .r2{inset:-9%;animation:spin 44s linear infinite reverse;border-color:rgba(56,232,255,.10)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .status{
    margin-top:26px;font-size:clamp(12px,3.2vw,14px);letter-spacing:.26em;text-transform:uppercase;
    color:var(--accent);min-height:1.4em;transition:color .35s ease;
    text-shadow:0 0 18px currentColor;
  }
  .hint{margin-top:8px;font-size:11px;letter-spacing:.08em;color:var(--muted);min-height:1.2em;text-align:center;padding:0 12px;max-width:520px}

  /* ---- transcript ---- */
  .log{
    position:relative;z-index:2;width:min(680px,100%);max-height:24vh;overflow-y:auto;
    margin-top:16px;display:flex;flex-direction:column;gap:8px;padding:0 4px;
    mask-image:linear-gradient(180deg,transparent,#000 18px);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 18px);
    scrollbar-width:none;
  }
  .log::-webkit-scrollbar{display:none}
  .msg{font-size:13.5px;line-height:1.55;opacity:0;animation:rise .35s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg b{display:block;font-size:9.5px;letter-spacing:.24em;font-weight:600;margin-bottom:2px;text-transform:uppercase}
  .me{text-align:right;color:#a9c6d2}
  .me b{color:#4e7284}
  .ai{color:#e6fbff}
  .ai b{color:var(--cyan-dim)}
  .msg.live{opacity:.62}

  /* ---- control ---- */
  .controls{position:relative;z-index:2;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:14px}
  button#mic{
    width:82px;height:82px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(56,232,255,.45);
    background:radial-gradient(circle at 50% 35%,rgba(56,232,255,.20),rgba(3,10,18,.9));
    color:var(--accent);display:grid;place-items:center;
    box-shadow:0 0 0 0 rgba(56,232,255,.35),0 0 30px rgba(56,232,255,.20) inset;
    transition:transform .18s cubic-bezier(.2,.9,.3,1.4),box-shadow .3s,border-color .3s,color .3s;
  }
  button#mic:active{transform:scale(.93)}
  button#mic svg{width:32px;height:32px}
  body.on button#mic{
    border-color:var(--accent);color:#031017;
    background:radial-gradient(circle at 50% 35%,var(--accent),#0a5c72);
    animation:halo 2.4s ease-out infinite;
  }
  @keyframes halo{
    0%{box-shadow:0 0 0 0 rgba(56,232,255,.45)}
    100%{box-shadow:0 0 0 26px rgba(56,232,255,0)}
  }
  .session{font-size:9.5px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  body.on .session{color:var(--accent)}
  .err{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,140%);
    z-index:9;max-width:min(560px,92vw);padding:12px 18px;border-radius:12px;
    background:rgba(30,6,10,.94);border:1px solid rgba(255,90,110,.5);color:#ffd9de;
    font-size:13px;line-height:1.45;text-align:center;transition:transform .4s cubic-bezier(.2,.9,.3,1.2);
    backdrop-filter:blur(8px);
  }
  .err.show{transform:translate(-50%,0)}

  /* ---- local agent indicator (Phase 1) ---- */
  .agent-ind{
    margin-top:14px;display:inline-flex;align-items:center;gap:8px;
    font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    cursor:pointer;user-select:none;
  }
  .agent-dot{
    width:7px;height:7px;border-radius:50%;background:#3a4a52;
    box-shadow:none;flex:0 0 auto;
  }
  .agent-ind.on{color:#8fd7c0}
  .agent-ind.on .agent-dot{background:#3dff9a;box-shadow:0 0 8px rgba(61,255,154,.7)}
  .agent-ind.auth{color:#ffb648}
  .agent-ind.auth .agent-dot{background:#ffb648;box-shadow:0 0 8px rgba(255,182,72,.45)}
  .agent-panel{
    display:none;margin:8px auto 0;width:min(280px,86vw);text-align:left;
  }
  .agent-panel.show{display:block}
  .agent-panel input{
    width:100%;background:rgba(8,16,24,.85);border:1px solid rgba(56,232,255,.22);
    color:var(--text);padding:7px 9px;border-radius:6px;font-size:11px;
    letter-spacing:0;text-transform:none;outline:none;
  }
  .agent-panel button{
    margin-top:6px;background:transparent;border:1px solid rgba(56,232,255,.35);
    color:var(--cyan);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
    padding:5px 10px;border-radius:6px;cursor:pointer;
  }
</style>
</head>
<body>

<div class="bg"><div class="grid"></div><div class="scan"></div></div>

<header>
  <h1>JARVIS</h1>
  <div class="tag">Your Personal AI Assistant</div>
  <div class="agent-ind" id="agentInd" title="Local computer agent status" role="button" tabindex="0">
    <span class="agent-dot" id="agentDot"></span>
    <span>LOCAL AGENT</span>
    <span class="agent-st" id="agentSt">Offline</span>
  </div>
  <div class="agent-panel" id="agentPanel">
    <input id="agentToken" type="password" autocomplete="off" spellcheck="false" placeholder="Paste local agent token" />
    <button type="button" id="agentSave">Connect</button>
  </div>
</header>

<main class="stage">
  <div class="orbwrap">
    <div class="ring r2"></div>
    <div class="ring r1"></div>
    <canvas id="orb"></canvas>
  </div>
  <div class="status" id="status">Ready</div>
  <div class="hint" id="hint">Tap the control once to begin a continuous voice session.</div>
  <div class="log" id="log"></div>
</main>

<div class="controls">
  <button id="mic" aria-label="Toggle voice session">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <rect x="9" y="2.5" width="6" height="11.5" rx="3"/>
      <path d="M5 11.5a7 7 0 0 0 14 0"/><path d="M12 18.5V21.5"/>
    </svg>
  </button>
  <div class="session" id="sessionLabel">Voice session off</div>
</div>

<div class="err" id="err"></div>

<script>
/* ==================================================================
   JARVIS — realtime voice client
   Architecture:  mic -> 16kHz PCM -> Gemini Live (WebSocket, ephemeral
   token) -> streamed 24kHz PCM -> speakers.  Server-side VAD handles
   turn taking and barge-in; nothing is transcribed in the browser.
   ================================================================== */

/* >>> PASTE YOUR APPS SCRIPT WEB APP /exec URL HERE <<< */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzJrvQD-Ia7pEqebsLvxTmqCATWc9631uC9YOO6aWo_wcY_Yn-pNMCq-zSafHyA6WF9BQ/exec";
const LOCAL_AGENT_URL = "http://127.0.0.1:18765";
const AGENT_TOKEN_KEY = "jarvis_local_agent_token";

const WS_HOST = "wss://generativelanguage.googleapis.com";
// Ephemeral tokens ONLY work on the ...Constrained endpoint.
const WS_PATH = v => "/ws/google.ai.generativelanguage." + v + ".GenerativeService.BidiGenerateContentConstrained";
const MIC_RATE = 16000, OUT_RATE = 24000;

const $ = id => document.getElementById(id);
const els = { status:$('status'), hint:$('hint'), log:$('log'), mic:$('mic'), session:$('sessionLabel'), err:$('err'),
  agentInd:$('agentInd'), agentSt:$('agentSt'), agentPanel:$('agentPanel'), agentToken:$('agentToken'), agentSave:$('agentSave') };

let state = 'idle';         // idle | connecting | listening | thinking | speaking | error
let active = false;
let ws = null, micCtx = null, outCtx = null, micStream = null, micNode = null, micSource = null;
let liveSetupReady = false;              // no realtimeInput until setupComplete
let liveSocketOpenedAt = null;
let liveSetupCompletedAt = null;
let outGain = null, analyser = null, freq = null;
let playHead = 0, playing = 0;          // scheduled-chunk bookkeeping
let liveNodes = [];                      // currently scheduled buffer sources
let micLevel = 0, spkLevel = 0;
let liveUser = null, liveAI = null;      // streaming transcript elements
let greeted = false;

/* ------------------------------------------------------------------ */
/* Agent tools: state                                                  */
/* ------------------------------------------------------------------ */
let toolStatusActive = false;             // true while a tool is executing
let cachedLocation = null;                // { lat, lon, address, city, ts }
const LOCATION_CACHE_MS = 5 * 60 * 1000; // cache location for 5 minutes

/* ------------------------------------------------------------------ */
/* Temporary one-turn latency diagnostics                              */
/* ------------------------------------------------------------------ */
// This is intentionally observation-only. It does not perform VAD or alter
// the audio path; the peak threshold is used only to label one test utterance.
const LATENCY_DIAGNOSTICS = true;
const DIAG_SPEECH_THRESHOLD = 0.025;
const DIAG_SILENCE_PACKETS = 3;
let latencyTurn = null;
let latencyPacketSeq = 0;
let latencyReportTimer = null;

function latencyStartTurn(at, peak, packetSeq){
  if (!LATENCY_DIAGNOSTICS || latencyTurn) return;
  latencyTurn = {
    speechStartAt: at,
    speechStartPeak: peak,
    socketOpenedAt: liveSocketOpenedAt,
    setupCompleteAt: liveSetupCompletedAt,
    firstPcmAt: null,
    firstPcmSentAt: null,
    firstPcmSeq: null,
    lastPcmAt: null,
    lastPcmSentAt: null,
    lastPcmSeq: null,
    speechEndAt: null,
    inputTranscriptReceivedAt: null,
    lastInputTranscriptAt: null,
    inputTranscriptEvents: 0,
    userTextRenderedAt: null,
    generationStartAt: null,
    turnCompleteAt: null,
    firstAudioReceivedAt: null,
    firstAudioPlayedAt: null,
    packets: 0,
    speechPackets: 0,
    sentPackets: 0,
    droppedPackets: 0,
    droppedBeforeSocket: 0,
    droppedBeforeSetup: 0,
    maxBufferedAmount: 0,
    serverEvents: 0,
    maxWsToHandlerMs: 0,
    maxServerHandlerMs: 0,
    sendIntervals: [],
    lastPacketAt: null,
    lastSentAt: null,
    silencePackets: 0,
    inputText: '',
    reportPrinted: false,
    firstSpeechPacketSeq: packetSeq
  };
  console.debug('[JARVIS LATENCY] speech_start:', at.toFixed(1) + 'ms',
    '(client peak ' + peak.toFixed(4) + ', diagnostic only)');
}

function latencyRecordMicPacket(at, peak, sentAt, packetSeq, dropReason, bufferedAmount){
  if (!LATENCY_DIAGNOSTICS) return;
  const speech = peak >= DIAG_SPEECH_THRESHOLD;
  if (!latencyTurn && speech) latencyStartTurn(at, peak, packetSeq);
  if (!latencyTurn) return;

  const t = latencyTurn;
  t.packets++;
  if (Number.isFinite(bufferedAmount)) t.maxBufferedAmount = Math.max(t.maxBufferedAmount, bufferedAmount);
  t.lastPacketAt = at;

  if (sentAt === null){
    t.droppedPackets++;
    if (dropReason === 'socket') t.droppedBeforeSocket++;
    if (dropReason === 'setup') t.droppedBeforeSetup++;
  } else {
    t.sentPackets++;
    if (t.lastSentAt !== null) t.sendIntervals.push(sentAt - t.lastSentAt);
    t.lastSentAt = sentAt;
  }

  if (speech){
    t.speechPackets++;
    t.silencePackets = 0;
    t.speechEndAt = null;
    if (t.firstPcmAt === null){
      t.firstPcmAt = at;
      t.firstPcmSentAt = sentAt;
      t.firstPcmSeq = packetSeq;
      console.debug('[JARVIS LATENCY] first_pcm_containing_speech:',
        at.toFixed(1) + 'ms (packet ' + packetSeq + ')');
      console.debug('[JARVIS LATENCY] first_pcm_sent:',
        sentAt === null ? 'not sent' : sentAt.toFixed(1) + 'ms',
        '(packet ' + packetSeq + ')');
    }
    t.lastPcmAt = at;
    t.lastPcmSentAt = sentAt;
    t.lastPcmSeq = packetSeq;
  } else if (t.lastPcmAt !== null){
    t.silencePackets++;
    if (t.silencePackets === DIAG_SILENCE_PACKETS){
      t.speechEndAt = t.lastPcmAt;
      console.debug('[JARVIS LATENCY] last_pcm_before_silence:',
        t.lastPcmAt.toFixed(1) + 'ms (packet ' + t.lastPcmSeq + ')');
      console.debug('[JARVIS LATENCY] last_pcm_sent_before_silence:',
        t.lastPcmSentAt === null ? 'not sent' : t.lastPcmSentAt.toFixed(1) + 'ms');
    }
  }
}

function latencyMark(name, at){
  if (!LATENCY_DIAGNOSTICS || !latencyTurn || latencyTurn[name] !== null) return;
  latencyTurn[name] = at === undefined ? performance.now() : at;
}
function latencyRecordServerHandler(startAt, wsReceivedAt){
  if (!LATENCY_DIAGNOSTICS || !latencyTurn) return;
  latencyTurn.serverEvents++;
  latencyTurn.maxServerHandlerMs = Math.max(latencyTurn.maxServerHandlerMs, performance.now() - startAt);
  if (wsReceivedAt !== undefined){
    latencyTurn.maxWsToHandlerMs = Math.max(
      latencyTurn.maxWsToHandlerMs, startAt - wsReceivedAt
    );
  }
}

function latencyDelta(later, earlier){
  return later === null || earlier === null ? null : later - earlier;
}
function latencyMs(value){
  return value === null || !Number.isFinite(value) ? 'n/a' : value.toFixed(1) + 'ms';
}
function latencyDelay(later, earlier){
  const d = latencyDelta(later, earlier);
  return d === null ? 'n/a' : latencyMs(d);
}
function latencyAudioPerfAt(contextTime, ctx){
  if (!ctx) return performance.now();
  return performance.now() + (contextTime - ctx.currentTime) * 1000;
}

function printLatencyReport(){
  if (!LATENCY_DIAGNOSTICS || !latencyTurn || latencyTurn.reportPrinted) return;
  latencyTurn.reportPrinted = true;
  const t = latencyTurn;
  const speechEnd = t.speechEndAt || t.lastPcmAt;
  const cadence = t.sendIntervals.length
    ? t.sendIntervals.reduce((a,b) => a+b, 0) / t.sendIntervals.length
    : null;
  const minCadence = t.sendIntervals.length ? Math.min(...t.sendIntervals) : null;
  const maxCadence = t.sendIntervals.length ? Math.max(...t.sendIntervals) : null;
  const report = [
    '[JARVIS LATENCY]',
    'speech_start: ' + latencyMs(t.speechStartAt),
    'websocket_open: ' + latencyMs(t.socketOpenedAt),
    'setup_complete: ' + latencyMs(t.setupCompleteAt),
    'first_pcm_callback: ' + latencyMs(t.firstPcmAt),
    'first_pcm_sent: ' + latencyMs(t.firstPcmSentAt),
    'last_pcm_before_silence: ' + latencyMs(t.lastPcmAt),
    'last_pcm_sent_before_silence: ' + latencyMs(t.lastPcmSentAt),
    'input_transcript_received: ' + latencyMs(t.inputTranscriptReceivedAt),
    'input_transcript_events: ' + t.inputTranscriptEvents,
    'user_text_rendered: ' + latencyMs(t.userTextRenderedAt),
    'speech_end (client estimate): ' + latencyMs(speechEnd),
    'generation_start (first modelTurn): ' + latencyMs(t.generationStartAt),
    'turn_complete: ' + latencyMs(t.turnCompleteAt),
    'first_response_audio_received: ' + latencyMs(t.firstAudioReceivedAt),
    'first_audio_played: ' + latencyMs(t.firstAudioPlayedAt),
    '',
    'delays:',
    'speech -> first PCM: ' + latencyDelay(t.firstPcmAt, t.speechStartAt),
    'speech -> first PCM sent: ' + latencyDelay(t.firstPcmSentAt, t.speechStartAt),
    'PCM sent -> input transcript: ' + latencyDelay(t.inputTranscriptReceivedAt, t.firstPcmSentAt),
    'input transcript -> UI: ' + latencyDelay(t.userTextRenderedAt, t.inputTranscriptReceivedAt),
    'speech end -> turn complete: ' + latencyDelay(t.turnCompleteAt, speechEnd),
    'turn complete -> first audio: ' + latencyDelay(t.firstAudioReceivedAt, t.turnCompleteAt),
    'first audio received -> first audio played: ' + latencyDelay(t.firstAudioPlayedAt, t.firstAudioReceivedAt),
    '',
    'audio packets: ' + t.sentPackets + ' sent, ' + t.droppedPackets + ' not sent',
    'not sent: ' + t.droppedBeforeSetup + ' before setupComplete, ' + t.droppedBeforeSocket + ' before WebSocket OPEN',
    'send cadence: average ' + latencyMs(cadence) + ', min ' + latencyMs(minCadence) + ', max ' + latencyMs(maxCadence),
    'max WebSocket bufferedAmount: ' + t.maxBufferedAmount + ' bytes',
    'serverContent events: ' + t.serverEvents + ', max WS receive -> handler: ' + latencyMs(t.maxWsToHandlerMs),
    'max server event handler time: ' + latencyMs(t.maxServerHandlerMs),
    'diagnostic source: client mic peak >= ' + DIAG_SPEECH_THRESHOLD
  ].join('\n');
  window.__JARVIS_LATENCY_LAST_TURN__ = t;
  console.info(report);
}

function latencyScheduleReport(){
  if (!LATENCY_DIAGNOSTICS || !latencyTurn || latencyTurn.turnCompleteAt === null) return;
  clearTimeout(latencyReportTimer);
  // Input transcription is documented as independently ordered, so leave a
  // short observation window after turnComplete before printing the report.
  latencyReportTimer = setTimeout(printLatencyReport, 1200);
}

/* ------------------------------------------------------------------ */
/* UI                                                                  */
/* ------------------------------------------------------------------ */
const HINTS = {
  idle:       'Tap the control once to begin a continuous voice session.',
  connecting: 'Establishing secure realtime link…',
  listening:  'Just talk. No need to press anything again.',
  thinking:   '',
  speaking:   'Speak any time to interrupt.',
  error:      ''
};
const LABELS = { idle:'Ready', connecting:'Connecting', listening:'Listening', thinking:'Thinking', speaking:'Speaking', error:'Offline' };
const COLORS = { idle:'#38e8ff', connecting:'#38e8ff', listening:'#38e8ff', thinking:'#ffb648', speaking:'#7ef3c6', error:'#ff5a6e' };

function setState(s){
  if (state === s) return;
  state = s;
  if (toolStatusActive) return; // tool status overrides normal status display
  els.status.textContent = LABELS[s];
  if (HINTS[s] !== undefined && !(s==='error')) els.hint.textContent = HINTS[s];
  document.documentElement.style.setProperty('--accent', COLORS[s]);
}
function showToolStatus(msg){
  toolStatusActive = true;
  els.status.textContent = msg;
  els.hint.textContent = msg;
  document.documentElement.style.setProperty('--accent', COLORS.thinking);
}
function clearToolStatus(){
  toolStatusActive = false;
  // Re-apply current state to restore normal display
  const s = state;
  state = '';  // force setState to re-render
  setState(s);
}
function setSession(on){
  active = on;
  document.body.classList.toggle('on', on);
  els.session.textContent = on ? 'Voice session on' : 'Voice session off';
}
function showError(msg){
  els.err.textContent = msg;
  els.err.classList.add('show');
  clearTimeout(showError._t);
  showError._t = setTimeout(()=>els.err.classList.remove('show'), 7000);
}
function addMsg(who, text, live){
  const d = document.createElement('div');
  d.className = 'msg ' + (who==='me'?'me':'ai') + (live?' live':'');
  d.innerHTML = '<b>' + (who==='me'?'You':'JARVIS') + '</b><span></span>';
  d.lastChild.textContent = text;
  els.log.appendChild(d);
  els.log.scrollTop = els.log.scrollHeight;
  while (els.log.children.length > 40) els.log.removeChild(els.log.firstChild);
  return d;
}
function appendTo(el, text){
  el.lastChild.textContent += text;
  els.log.scrollTop = els.log.scrollHeight;
  if (el && el.classList.contains('me')){
    const firstRender = latencyTurn && latencyTurn.userTextRenderedAt === null;
    latencyMark('userTextRenderedAt');
    if (firstRender) console.debug('[JARVIS LATENCY] user_text_rendered:',
      latencyTurn.userTextRenderedAt.toFixed(1) + 'ms');
  }
}
function seal(el){ if (el) el.classList.remove('live'); }
function renderInputTranscript(text){
  if (!text) return;
  if (!liveUser){ seal(liveAI); liveAI = null; liveUser = addMsg('me','',true); }
  appendTo(liveUser, text);
  if (state !== 'speaking') setState('listening');
}

/* ------------------------------------------------------------------ */
/* Orb                                                                 */
/* ------------------------------------------------------------------ */
(function orb(){
  const c = $('orb'), g = c.getContext('2d');
  let W=0,H=0,dpr=1,t=0;
  function fit(){
    dpr = Math.min(devicePixelRatio||1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = W*dpr; c.height = H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', fit); fit();

  function draw(){
    t += 0.016;
    // sample live audio energy
    if (analyser && freq){
      analyser.getByteFrequencyData(freq);
      let s=0; for (let i=0;i<freq.length;i++) s+=freq[i];
      spkLevel += ((s/freq.length/128) - spkLevel) * 0.28;
    } else spkLevel *= 0.9;

    const col = COLORS[state] || '#38e8ff';
    const base = Math.min(W,H)*0.30;
    let energy = 0;
    if (state==='listening') energy = micLevel*1.5;
    else if (state==='speaking') energy = spkLevel*1.1;
    else if (state==='thinking') energy = 0.20 + Math.sin(t*7)*0.10;
    energy = Math.min(energy, 1.1);

    g.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2;
    const pulse = 1 + Math.sin(t*1.5)*0.03 + energy*0.30;
    const R = base*pulse;

    // outer glow
    const glow = g.createRadialGradient(cx,cy,R*0.2,cx,cy,R*2.1);
    glow.addColorStop(0, hex(col, .45 + energy*.35));
    glow.addColorStop(.45, hex(col, .10));
    glow.addColorStop(1, hex(col, 0));
    g.fillStyle = glow; g.beginPath(); g.arc(cx,cy,R*2.1,0,7); g.fill();

    // core sphere
    const core = g.createRadialGradient(cx-R*.3, cy-R*.35, R*.05, cx, cy, R);
    core.addColorStop(0, hex('#ffffff', .95));
    core.addColorStop(.30, hex(col, .80));
    core.addColorStop(.75, hex(col, .22));
    core.addColorStop(1, hex(col, .04));
    g.fillStyle = core; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();

    // reactive waveform rings
    for (let k=0;k<3;k++){
      g.beginPath();
      const rr = R*(1.10 + k*0.16);
      const amp = R*(0.035 + energy*0.20)/(k*0.6+1);
      for (let a=0;a<=64;a++){
        const th = a/64*Math.PI*2;
        const n = Math.sin(th*(3+k) + t*(1.8+k*0.7)) * amp
                + Math.sin(th*(7-k) - t*(2.4+k)) * amp*0.5;
        const x = cx + Math.cos(th)*(rr+n), y = cy + Math.sin(th)*(rr+n);
        a ? g.lineTo(x,y) : g.moveTo(x,y);
      }
      g.closePath();
      g.strokeStyle = hex(col, (.34 - k*.09) * (0.5 + energy));
      g.lineWidth = 1.2; g.stroke();
    }

    // orbiting particles
    for (let i=0;i<18;i++){
      const th = t*0.35 + i*(Math.PI*2/18);
      const rr = R*(1.5 + Math.sin(t*1.1+i)*0.16);
      const x = cx + Math.cos(th)*rr, y = cy + Math.sin(th)*rr*0.42;
      g.fillStyle = hex(col, .30 + energy*.4);
      g.beginPath(); g.arc(x,y, 1.1 + energy*1.4, 0, 7); g.fill();
    }

    requestAnimationFrame(draw);
  }
  function hex(h,a){
    const n = parseInt(h.slice(1),16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+Math.max(0,Math.min(1,a))+')';
  }
  draw();
})();

/* ------------------------------------------------------------------ */
/* Audio helpers                                                       */
/* ------------------------------------------------------------------ */
function b64ToBytes(b64){
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes){
  let s=''; const CH=0x8000;
  for (let i=0;i<bytes.length;i+=CH) s += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}

/* Mic capture worklet: downsamples to 16 kHz mono int16 and reports level. */
const WORKLET_SRC = `
class MicProc extends AudioWorkletProcessor {
  constructor(){ super(); this.ratio = sampleRate / ${MIC_RATE}; this.pos = 0; this.buf = []; this.packetPeak = 0; }
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    let peak = 0;
    for (let i=0;i<ch.length;i++){ const v = Math.abs(ch[i]); if (v>peak) peak=v; }
    this.packetPeak = Math.max(this.packetPeak, peak);
    // linear-interpolated resample to 16k
    while (this.pos < ch.length){
      const i0 = Math.floor(this.pos), frac = this.pos - i0;
      const a = ch[i0], b = (i0+1 < ch.length) ? ch[i0+1] : ch[ch.length-1];
      let s = a + (b-a)*frac;
      s = Math.max(-1, Math.min(1, s));
      this.buf.push(s < 0 ? s*0x8000 : s*0x7fff);
      this.pos += this.ratio;
    }
    this.pos -= ch.length;
    if (this.buf.length >= 320){            // ~20 ms packets
      const pcm = new Int16Array(this.buf.splice(0, this.buf.length));
      this.port.postMessage({ pcm: pcm.buffer, peak: this.packetPeak }, [pcm.buffer]);
      this.packetPeak = 0;
    }
    return true;
  }
}
registerProcessor('mic-proc', MicProc);
`;

/* ------------------------------------------------------------------ */
/* Session lifecycle                                                   */
/* ------------------------------------------------------------------ */
async function startSession(){
  if (active) return;
  setSession(true); setState('connecting');
  greeted = false; liveUser = liveAI = null;
  clearTimeout(latencyReportTimer);
  latencyReportTimer = null;
  latencyTurn = null;
  latencyPacketSeq = 0;
  liveSocketOpenedAt = null;
  liveSetupCompletedAt = null;

  // 1) microphone + 2) ephemeral token (real key never reaches the browser)
  // Both are on the critical path, so start them concurrently: the token
  // fetch runs in the background while the user taps "Allow" on the mic.
  const micPromise = navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 }
  });
  let auth;
  try {
    auth = await getToken();
  } catch (e){
    console.error('token', e);
    try { const s = await micPromise; s.getTracks().forEach(t=>t.stop()); } catch(_){}
    fail(e.message || "I couldn't connect to JARVIS's AI service.");
    return;
  }
  try {
    micStream = await micPromise;
  } catch (e){
    console.error('mic', e);
    fail(e && e.name === 'NotAllowedError'
      ? 'Please allow microphone access for JARVIS, then tap again.'
      : 'No microphone was found. Connect one and try again.');
    return;
  }

  // 3) audio graph
  try { await buildAudio(); } catch(e){ console.error('audio', e); fail('Audio could not be initialised on this browser.'); return; }

  // 4) realtime socket
  openSocket(auth);
}

function fail(msg){
  showError(msg);
  setState('error');
  els.hint.textContent = msg;
  stopSession(true);
  setTimeout(()=>{ if(!active) setState('idle'); els.hint.textContent = HINTS.idle; }, 4500);
}

async function getToken(){
  if (!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR') === 0)
    throw new Error('JARVIS is not configured yet — add your backend URL.');
  const r = await fetch(BACKEND_URL + (BACKEND_URL.includes('?')?'&':'?') + 'action=token&t=' + Date.now());
  if (!r.ok) throw new Error("I couldn't connect to JARVIS's AI service.");
  const d = await r.json();
  if (!d.ok || !d.token) throw new Error(d.error || 'JARVIS is temporarily unavailable. Please try again.');
  return d;
}

async function buildAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;

  outCtx = new AC({ sampleRate: OUT_RATE, latencyHint:'interactive' });
  await outCtx.resume();
  outGain  = outCtx.createGain();
  analyser = outCtx.createAnalyser();
  analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.6;
  freq = new Uint8Array(analyser.frequencyBinCount);
  outGain.connect(analyser); analyser.connect(outCtx.destination);
  playHead = outCtx.currentTime;

  micCtx = new AC({ latencyHint:'interactive' });
  await micCtx.resume();
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type:'application/javascript' }));
  await micCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  micSource = micCtx.createMediaStreamSource(micStream);
  micNode = new AudioWorkletNode(micCtx, 'mic-proc', { numberOfInputs:1, numberOfOutputs:0 });
  micNode.port.onmessage = ev => {
    const packetAt = performance.now();
    const packetSeq = ++latencyPacketSeq;
    const peak = Number(ev.data.peak) || 0;
    micLevel += (peak - micLevel) * 0.35;
    let wsSendAt = null;
    let bufferedAmount = null;
    let dropReason = null;
    if (ws && ws.readyState === 1 && liveSetupReady){
      const message = JSON.stringify({
        realtimeInput:{ audio:{ mimeType:'audio/pcm;rate=' + MIC_RATE, data: bytesToB64(new Uint8Array(ev.data.pcm)) } }
      });
      wsSendAt = performance.now();
      ws.send(message);
      bufferedAmount = ws.bufferedAmount;
    } else {
      // The worklet starts before the handshake; Gemini requires setupComplete
      // before accepting any realtimeInput, so pre-handshake audio is ignored.
      dropReason = !ws || ws.readyState !== 1 ? 'socket' : 'setup';
    }
    latencyRecordMicPacket(packetAt, peak, wsSendAt, packetSeq, dropReason, bufferedAmount);
  };
  micSource.connect(micNode);
}

function openSocket(auth){
  const url = WS_HOST + WS_PATH(auth.apiVersion || 'v1alpha') + '?access_token=' + encodeURIComponent(auth.token);
  liveSetupReady = false;
  liveSocketOpenedAt = null;
  liveSetupCompletedAt = null;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    liveSocketOpenedAt = performance.now();
    // The token already carries the full locked setup (model, persona, voice,
    // VAD, tools). We still must send a setup frame first; an empty one means
    // "use the constraints baked into the token".
    ws.send(JSON.stringify({ setup:{} }));
  };

  ws.onmessage = async ev => {
    const wsReceivedAt = performance.now();
    let raw = ev.data;
    if (raw instanceof Blob) raw = await raw.text();
    else if (raw instanceof ArrayBuffer) raw = new TextDecoder().decode(raw);
    let m; try { m = JSON.parse(raw); } catch(e){ return; }
    handleServer(m, wsReceivedAt);
  };

  ws.onerror = e => { console.error('ws', e); };

  ws.onclose = ev => {
    liveSetupReady = false;
    console.warn('ws closed', ev.code, ev.reason);
    if (!active) return;
    if (ev.code === 1007 || ev.code === 1008 || ev.code === 1011){
      fail(ev.reason && /quota|resource/i.test(ev.reason)
        ? 'JARVIS is at its free usage limit. Try again shortly.'
        : 'JARVIS lost its connection. Tap to reconnect.');
    } else {
      fail('JARVIS lost its connection. Tap to reconnect.');
    }
  };
}

function handleServer(m, wsReceivedAt){
  if (m.setupComplete){
    // The protocol requires this acknowledgement before any realtimeInput.
    liveSetupCompletedAt = performance.now();
    liveSetupReady = true;
    if (latencyTurn && latencyTurn.setupCompleteAt === null){
      latencyTurn.setupCompleteAt = liveSetupCompletedAt;
    }
    setState('listening');
    if (!greeted){
      greeted = true;
      // One single greeting for the whole session.
      ws.send(JSON.stringify({
        clientContent:{
          turns:[{ role:'user', parts:[{ text:'(The session just opened. Greet me once, in under eight words, as JARVIS. Then stop.)' }] }],
          turnComplete:true
        }
      }));
    }
    return;
  }

  // ---- Agent tool calls (function calling) ----
  // Gemini Live sends toolCall at the top level of the message (outside
  // serverContent). Handle it here and continue to process any serverContent
  // that may accompany it in the same frame.
  if (m.toolCall && m.toolCall.functionCalls && m.toolCall.functionCalls.length) {
    for (const fc of m.toolCall.functionCalls) {
      executeToolCall(fc);
    }
  }

  const sc = m.serverContent;
  if (!sc) return;
  const handlerStartedAt = performance.now();
  const serverEventAt = wsReceivedAt === undefined ? handlerStartedAt : wsReceivedAt;

  // Input transcription is independently ordered from model/audio events.
  if (sc.inputTranscription && sc.inputTranscription.text){
    const firstInputEvent = latencyTurn && latencyTurn.inputTranscriptReceivedAt === null;
    latencyMark('inputTranscriptReceivedAt', serverEventAt);
    if (latencyTurn){
      latencyTurn.inputText += sc.inputTranscription.text;
      latencyTurn.lastInputTranscriptAt = serverEventAt;
      latencyTurn.inputTranscriptEvents++;
    }
    if (firstInputEvent) console.debug('[JARVIS LATENCY] input_transcript_received:',
      serverEventAt.toFixed(1) + 'ms');
    latencyScheduleReport();
  }
  if (sc.modelTurn && sc.modelTurn.parts && sc.modelTurn.parts.length){
    const firstGenerationEvent = latencyTurn && latencyTurn.generationStartAt === null;
    latencyMark('generationStartAt', serverEventAt);
    if (firstGenerationEvent) console.debug('[JARVIS LATENCY] generation_start (first modelTurn):',
      serverEventAt.toFixed(1) + 'ms');
  }
  if (sc.turnComplete){
    const firstTurnComplete = latencyTurn && latencyTurn.turnCompleteAt === null;
    latencyMark('turnCompleteAt', serverEventAt);
    if (firstTurnComplete) console.debug('[JARVIS LATENCY] turn_complete:',
      serverEventAt.toFixed(1) + 'ms');
    latencyScheduleReport();
  }

  // barge-in: the model cancelled its own turn because we started talking
  if (sc.interrupted){
    flushPlayback();
    seal(liveAI); liveAI = null;
    if (sc.inputTranscription && sc.inputTranscription.text){
      renderInputTranscript(sc.inputTranscription.text);
    }
    setState('listening');
    latencyRecordServerHandler(handlerStartedAt, wsReceivedAt);
    return;
  }

  // our speech, transcribed by the server. Render each delta immediately;
  // this also runs for a message that carries interrupted (barge-in).
  if (!sc.interrupted && sc.inputTranscription && sc.inputTranscription.text){
    renderInputTranscript(sc.inputTranscription.text);
  }

  // JARVIS's own words
  if (sc.outputTranscription && sc.outputTranscription.text){
    if (liveUser){ seal(liveUser); liveUser = null; }
    if (!liveAI) liveAI = addMsg('ai','',true);
    appendTo(liveAI, sc.outputTranscription.text);
  }

  const parts = (sc.modelTurn && sc.modelTurn.parts) || [];
  for (const p of parts){
    // Audio data (existing behavior)
    const d = p.inlineData;
    if (d && d.mimeType && d.mimeType.indexOf('audio/pcm') === 0){
      if (liveUser){ seal(liveUser); liveUser = null; }
      enqueue(d.data, serverEventAt);
    }
    // Function call within model turn (alternative to top-level toolCall)
    if (p.functionCall){
      executeToolCall({ name: p.functionCall.name, id: p.functionCall.id, args: p.functionCall.args || {} });
    }
  }
  if (parts.length && state !== 'speaking') setState('speaking');

  if (sc.generationComplete && !playing) setState('listening');
  if (sc.turnComplete){
    seal(liveAI); liveAI = null;
    if (!playing) setState('listening');
  }
  latencyRecordServerHandler(handlerStartedAt, wsReceivedAt);
}

/* ---- streaming playback: schedule chunks back-to-back, no gaps ---- */
function enqueue(b64, receivedAt){
  if (!outCtx) return;
  const audioReceivedAt = receivedAt === undefined ? performance.now() : receivedAt;
  const bytes = b64ToBytes(b64);
  const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.byteLength>>1);
  if (!pcm.length) return;
  const firstAudio = latencyTurn && latencyTurn.firstAudioReceivedAt === null;
  latencyMark('firstAudioReceivedAt', audioReceivedAt);
  if (firstAudio) console.debug('[JARVIS LATENCY] first_response_audio_received:',
    audioReceivedAt.toFixed(1) + 'ms');
  const buf = outCtx.createBuffer(1, pcm.length, OUT_RATE);
  const ch = buf.getChannelData(0);
  for (let i=0;i<pcm.length;i++) ch[i] = pcm[i] / 32768;

  const now = outCtx.currentTime;
  if (playHead < now + 0.04) playHead = now + 0.04;   // small joint buffer
  const src = outCtx.createBufferSource();
  src.buffer = buf; src.connect(outGain);
  const firstScheduledAt = playHead;
  src.start(firstScheduledAt);
  playHead += buf.duration;
  if (latencyTurn && latencyTurn.firstAudioPlayedAt === null){
    // AudioBufferSourceNode has no onstart callback. Map its audio-clock start
    // to performance.now(); this is the first audible-sample estimate.
    latencyMark('firstAudioPlayedAt', latencyAudioPerfAt(firstScheduledAt, outCtx));
    console.debug('[JARVIS LATENCY] first_audio_played:',
      latencyTurn.firstAudioPlayedAt.toFixed(1) + 'ms (audio-clock estimate)');
    latencyScheduleReport();
  }
  playing++;
  liveNodes.push(src);
  setState('speaking');
  src.onended = () => {
    playing = Math.max(0, playing-1);
    liveNodes = liveNodes.filter(n => n !== src);
    if (!playing && active && state === 'speaking') setState('listening');
  };
}
function flushPlayback(){
  liveNodes.forEach(n => { try{ n.onended=null; n.stop(); }catch(e){} });
  liveNodes = []; playing = 0;
  if (outCtx) playHead = outCtx.currentTime;
}

/* ------------------------------------------------------------------ */
/* Agent tools: execution                                              */
/* ------------------------------------------------------------------ */

async function executeToolCall(fc){
  const name = fc.name;
  const id   = fc.id;
  const args = fc.args || {};
  console.info('[JARVIS TOOL]', name, JSON.stringify(args));

  let result;
  let screenImage = null;
  try {
    if (name === 'web_search') {
      showToolStatus('Searching the web…');
      result = await executeWebSearch(args.query || '');
    } else if (name === 'get_current_location') {
      showToolStatus('Getting your location…');
      result = await executeGetLocation();
    } else if (name === 'search_nearby') {
      const cat = args.category || 'any';
      showToolStatus('Finding nearby ' + cat + '…');
      result = await executeSearchNearby(cat, args.radius_km);
    } else if (name === 'capture_screen') {
      showToolStatus('Looking at your screen...');
      result = await executeCaptureScreen();
      if (result && result.ok && result.image) {
        screenImage = { mimeType: result.mime_type || result.mimeType || 'image/jpeg', data: result.image };
        showToolStatus('Screen analyzed.');
        await new Promise(r => setTimeout(r, 350));
      }
    } else if (name === 'get_active_window') {
      showToolStatus('Checking the active window…');
      result = await executeGetActiveWindow();
    } else if (name === 'get_screen_info') {
      showToolStatus('Reading display information…');
      result = await executeGetScreenInfo();
    } else {
      result = { ok: false, error: 'unknown_tool: ' + name };
    }
  } catch (e) {
    console.error('[JARVIS TOOL] error:', e);
    result = { ok: false, error: e.message || 'Tool execution failed' };
  }

  // Never send raw screenshot bytes inside the JSON result string.
  if (result && typeof result === 'object' && result.image) {
    result = Object.assign({}, result);
    delete result.image;
  }

  clearToolStatus();

  // Send the tool response back to Gemini Live
  if (ws && ws.readyState === 1) {
    if (screenImage && screenImage.data) {
      // Live API vision path: one on-demand frame, then discard.
      ws.send(JSON.stringify({
        realtimeInput: { video: { mimeType: screenImage.mimeType, data: screenImage.data } }
      }));
    }
    const response = JSON.stringify({
      toolResponse: {
        functionResponses: [{
          id: id,
          name: name,
          response: { result: typeof result === 'string' ? result : JSON.stringify(result) },
          parts: (screenImage && screenImage.data)
            ? [{ inlineData: { mimeType: screenImage.mimeType, data: screenImage.data } }]
            : undefined
        }]
      }
    });
    ws.send(response);
    screenImage = null;
    console.info('[JARVIS TOOL] response sent for', name);
  } else {
    screenImage = null;
    console.warn('[JARVIS TOOL] socket not ready, cannot send response for', name);
  }
}

/* ---- web_search: call the server-side backend ---- */
async function executeWebSearch(query){
  if (!query || !query.trim()) return { ok: false, error: 'No search query provided.' };
  if (!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR') === 0)
    return { ok: false, error: 'Backend not configured.' };

  const url = BACKEND_URL + (BACKEND_URL.includes('?') ? '&' : '?')
    + 'action=web_search&q=' + encodeURIComponent(query) + '&t=' + Date.now();

  const r = await fetch(url);
  if (!r.ok) return { ok: false, error: 'Search request failed (HTTP ' + r.status + ').' };
  const data = await r.json();
  if (!data.ok) return { ok: false, error: data.error || 'Search returned no results.' };
  return {
    ok: true,
    query: query,
    results: data.text,
    sources: (data.sources || []).slice(0, 5)
  };
}

/* ---- get_current_location: browser geolocation + reverse geocoding ---- */
async function executeGetLocation(){
  if (!navigator.geolocation)
    return { ok: false, error: 'Geolocation is not supported by this browser.' };

  // Return cached location if fresh
  if (cachedLocation && (Date.now() - cachedLocation.ts) < LOCATION_CACHE_MS) {
    return {
      ok: true,
      latitude: cachedLocation.lat,
      longitude: cachedLocation.lon,
      address: cachedLocation.address,
      city: cachedLocation.city,
      region: cachedLocation.region,
      country: cachedLocation.country,
      cached: true
    };
  }

  const pos = await new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: false,
      timeout: 10000,
      maximumAge: 60000
    });
  }).catch(err => {
    if (err.code === 1) return { error: 'Location permission denied by user.' };
    if (err.code === 2) return { error: 'Location unavailable. The device could not determine your position.' };
    if (err.code === 3) return { error: 'Location request timed out.' };
    return { error: 'Location error: ' + (err.message || 'unknown') };
  });

  if (pos && pos.error) return { ok: false, error: pos.error };
  if (!pos || !pos.coords)
    return { ok: false, error: 'Could not obtain your location.' };

  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  // Reverse geocode via Nominatim (OpenStreetMap)
  let address = '', city = '', region = '', country = '';
  try {
    const geoUrl = 'https://nominatim.openstreetmap.org/reverse'
      + '?lat=' + lat + '&lon=' + lon
      + '&format=json&zoom=14&addressdetails=1&accept-language=en';
    const r = await fetch(geoUrl);
    if (r.ok) {
      const geo = await r.json();
      address = geo.display_name || '';
      const a = geo.address || {};
      city    = a.city || a.town || a.village || a.hamlet || a.suburb || '';
      region  = a.state || a.region || a.county || '';
      country = a.country || '';
    }
  } catch (e) {
    // Geocoding failure is non-fatal; we still have coordinates
    console.warn('[JARVIS TOOL] reverse geocoding failed:', e);
  }

  // Cache the location
  cachedLocation = { lat, lon, address, city, region, country, ts: Date.now() };

  return {
    ok: true,
    latitude: lat,
    longitude: lon,
    address: address || 'Approximate coordinates: ' + lat.toFixed(4) + ', ' + lon.toFixed(4),
    city: city,
    region: region,
    country: country
  };
}

  grocery:      { tags: [['shop','supermarket'],['shop','convenience'],['shop','greengrocer']], label: 'grocery stores' },
  fuel:         { tags: [['amenity','fuel']], label: 'fuel stations' },
  hotel:        { tags: [['tourism','hotel'],['tourism','guest_house'],['tourism','motel']], label: 'hotels and guest houses' }
};

function buildOverpassQuery(lat, lon, radiusM, tags){
  const parts = tags.map(([k,v]) => {
    const q = 'node["' + k + '"="' + v + '"](around:' + radiusM + ',' + lat + ',' + lon + ');'
            + 'way["' + k + '"="' + v + '"](around:' + radiusM + ',' + lat + ',' + lon + ');';
    return q;
  });
  return '[out:json][timeout:12];(' + parts.join('') + ');out center 15;';
}

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2)
          + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
          * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDistance(km){
  if (km < 1) return Math.round(km * 1000) + ' meters';
  return km.toFixed(1) + ' km';
}

async function executeSearchNearby(category, radiusKm){
  // Ensure we have a location
  let loc = cachedLocation;
  if (!loc || (Date.now() - loc.ts) > LOCATION_CACHE_MS) {
    const locResult = await executeGetLocation();
    if (!locResult.ok) return locResult;
    loc = { lat: locResult.latitude, lon: locResult.longitude, address: locResult.address,
            city: locResult.city, region: locResult.region, country: locResult.country, ts: Date.now() };
    cachedLocation = loc;
  }

  const catKey = (category || 'any').toLowerCase().replace(/[^a-z_]/g, '');
  const catDef = NEARBY_CATEGORIES[catKey];
  const radiusM = Math.min(Math.max(Math.round((radiusKm || 2) * 1000), 200), 10000);

  let tags;
  if (catDef) {
    tags = catDef.tags;
  } else {
    // "any" or unknown category — search a broad set
    tags = [
      ['amenity','clinic'],['amenity','hospital'],['amenity','pharmacy'],
      ['amenity','doctors'],['amenity','dentist'],['amenity','restaurant'],
      ['amenity','cafe'],['amenity','bank'],['amenity','atm'],['amenity','fuel'],
      ['shop','supermarket'],['tourism','hotel']
    ];
  }

  const query = buildOverpassQuery(loc.lat, loc.lon, radiusM, tags);
  const overpassUrl = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);

  let elements;
  try {
    const r = await fetch(overpassUrl);
    if (!r.ok) return { ok: false, error: 'Nearby search failed (HTTP ' + r.status + ').' };
    const data = await r.json();
    elements = data.elements || [];
  } catch (e) {
    return { ok: false, error: 'Nearby search request failed: ' + (e.message || 'network error') };
  }

  if (!elements.length) {
    return {
      ok: true,
      found: 0,
      category: catDef ? catDef.label : category,
      radius: formatDistance(radiusM / 1000),
      message: 'No ' + (catDef ? catDef.label : category) + ' found within ' + formatDistance(radiusM / 1000) + ' of your location.'
    };
  }

  // Enrich with distance and sort
  const results = elements.map(el => {
    const elLat = el.lat || (el.center && el.center.lat);
    const elLon = el.lon || (el.center && el.center.lon);
    const dist  = (elLat !== undefined && elLon !== undefined)
      ? haversineKm(loc.lat, loc.lon, elLat, elLon) : null;
    const tags  = el.tags || {};
    return {
      name:    tags.name || tags['name:en'] || 'Unnamed',
      category:tags.amenity || tags.shop || tags.tourism || category,
      address: tags['addr:street']
        ? (tags['addr:housenumber'] ? tags['addr:housenumber'] + ' ' : '') + tags['addr:street']
          + (tags['addr:city'] ? ', ' + tags['addr:city'] : '')
        : '',
      phone:   tags.phone || tags['contact:phone'] || '',
      opening: tags.opening_hours || '',
      website: tags.website || tags['contact:website'] || '',
      distance: dist,
      distanceText: dist !== null ? formatDistance(dist) : 'unknown',
      lat: elLat,
      lon: elLon,
      mapLink: (elLat !== undefined && elLon !== undefined)
        ? 'https://www.openstreetmap.org/?mlat=' + elLat + '&mlon=' + elLon + '#map=17/' + elLat + '/' + elLon
        : ''
    };
  }).filter(r => r.lat !== undefined)
    .sort((a, b) => (a.distance || 999) - (b.distance || 999))
    .slice(0, 8);

  return {
    ok: true,
    found: results.length,
    category: catDef ? catDef.label : category,
    radius: formatDistance(radiusM / 1000),
    userLocation: loc.city ? loc.city + (loc.region ? ', ' + loc.region : '') : loc.address,
    results: results
  };
}

/* ------------------------------------------------------------------ */
/* Local computer agent (Phase 1) — screen / window / display info     */
/* ------------------------------------------------------------------ */

const AGENT_OFFLINE = {
  ok: false,
  error: 'agent_offline',
  message: "Sir, the local computer agent isn't connected."
};

function setAgentUi(state){
  agentState = state;
  if (!els.agentInd) return;
  els.agentInd.classList.toggle('on', state === 'connected');
  els.agentInd.classList.toggle('auth', state === 'auth');
  if (els.agentSt) {
    els.agentSt.textContent = state === 'connected' ? 'Connected'
      : state === 'auth' ? 'Needs token' : 'Offline';
  }
}

function getAgentToken(){
  try { return localStorage.getItem(AGENT_TOKEN_KEY) || ''; } catch (e) { return ''; }
}
function saveAgentToken(token){
  try {
    if (token) localStorage.setItem(AGENT_TOKEN_KEY, token);
    else localStorage.removeItem(AGENT_TOKEN_KEY);
  } catch (e) {}
}

async function agentFetch(path, opts){
  const token = getAgentToken();
  if (!token) return { _offline: true, _needToken: true };
  try {
    const r = await fetch(LOCAL_AGENT_URL + path, {
      method: (opts && opts.method) || 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      cache: 'no-store'
    });
    if (r.status === 401) {
      setAgentUi('auth');
      return {
        ok: false,
        error: 'permission_denied',
        message: "Sir, I don't currently have permission to access the screen."
      };
    }
    let data;
    try { data = await r.json(); } catch (e) {
      return {
        ok: false,
        error: 'capture_failed',
        message: "Something went wrong while accessing the screen, sir."
      };
    }
    return data;
  } catch (e) {
    setAgentUi('offline');
    return { _offline: true };
  }
}

async function executeCaptureScreen(){
  const data = await agentFetch('/capture_screen', { method: 'POST' });
  if (data && data._offline) return AGENT_OFFLINE;
  if (!data || !data.ok) {
    if (data && data.error === 'permission_denied') {
      return {
        ok: false,
        error: 'permission_denied',
        message: data.message || "Sir, I don't currently have permission to access the screen."
      };
    }
    return {
      ok: false,
      error: 'capture_failed',
      message: (data && data.message) || "Something went wrong while accessing the screen, sir."
    };
  }
  return data;
}

async function executeGetActiveWindow(){
  const data = await agentFetch('/active_window');
  if (data && data._offline) return AGENT_OFFLINE;
  if (!data || data.ok === false) {
    return data || { ok: false, error: 'unavailable', message: "Sir, I don't currently have permission to access the screen." };
  }
  return data;
}

async function executeGetScreenInfo(){
  const data = await agentFetch('/screen_info');
  if (data && data._offline) return AGENT_OFFLINE;
  if (!data || data.ok === false) {
    return data || { ok: false, error: 'unavailable', message: "Something went wrong while accessing the screen, sir." };
  }
  return data;
}

async function checkAgentConnection(){
  try {
    const health = await fetch(LOCAL_AGENT_URL + '/health', { cache: 'no-store' });
    if (!health.ok) { setAgentUi('offline'); return; }
    const token = getAgentToken();
    if (!token) { setAgentUi('auth'); return; }
    const ready = await fetch(LOCAL_AGENT_URL + '/ready', {
      cache: 'no-store',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (ready.ok) setAgentUi('connected');
    else setAgentUi('auth');
  } catch (e) {
    setAgentUi('offline');
  }
}

function startAgentWatch(){
  try {
    const params = new URLSearchParams(location.search);
    const fromUrl = params.get('agentToken');
    if (fromUrl) {
      saveAgentToken(fromUrl.trim());
      try {
        params.delete('agentToken');
        const qs = params.toString();
        history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
      } catch (e) {}
    }
  } catch (e) {}
  if (els.agentToken) els.agentToken.value = getAgentToken();
  checkAgentConnection();
  clearInterval(agentWatchTimer);
  agentWatchTimer = setInterval(checkAgentConnection, 5000);
  if (els.agentInd) {
    const toggle = () => { if (els.agentPanel) els.agentPanel.classList.toggle('show'); };
    els.agentInd.addEventListener('click', toggle);
    els.agentInd.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  }
  if (els.agentSave) {
    els.agentSave.addEventListener('click', () => {
      const token = (els.agentToken && els.agentToken.value || '').trim();
      saveAgentToken(token);
      if (els.agentPanel) els.agentPanel.classList.remove('show');
      checkAgentConnection();
    });
  }
}

function stopSession(silent){
  setSession(false);
  stopWarm();
  flushPlayback();
  toolStatusActive = false; // clear any pending tool status
  cachedLocation = null;    // don't persist location across sessions
  try { if (ws){ ws.onclose = null; ws.close(); } } catch(e){}
  ws = null;
  liveSetupReady = false;
  try { if (micNode){ micNode.port.onmessage = null; micNode.disconnect(); } } catch(e){}
  try { if (micSource) micSource.disconnect(); } catch(e){}
  try { if (micStream) micStream.getTracks().forEach(t=>t.stop()); } catch(e){}
  try { if (micCtx) micCtx.close(); } catch(e){}
  try { if (outCtx) outCtx.close(); } catch(e){}
  micNode = micSource = micStream = micCtx = outCtx = analyser = outGain = null;
  freq = null; micLevel = 0; spkLevel = 0;
  seal(liveUser); seal(liveAI); liveUser = liveAI = null;
  if (!silent){ setState('idle'); els.hint.textContent = HINTS.idle; }
}

/* ------------------------------------------------------------------ */
/* Backend keep-warm                                                   */
/* ------------------------------------------------------------------ */
// A cold Apps Script web app can take several seconds to answer the first
// token request. A lightweight ping on page load (and every 45s while a
// session is active) keeps the runtime hot so session starts are fast.
let warmTimer = null;
function warmBackend(){
  if (!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR') === 0) return;
  fetch(BACKEND_URL + (BACKEND_URL.includes('?')?'&':'?') + 'action=ping&t=' + Date.now())
    .then(r => r.json())
    .then(d => { if (d && d.ok) console.debug('[JARVIS] backend warm, model: ' + d.model); })
    .catch(() => {});
}
function startWarm(){
  warmBackend();
  clearInterval(warmTimer);
  warmTimer = setInterval(warmBackend, 45000);
}
function stopWarm(){
  clearInterval(warmTimer);
  warmTimer = null;
}

/* ------------------------------------------------------------------ */
els.mic.addEventListener('click', () => { active ? stopSession(false) : startSession(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); els.mic.click(); }
});
addEventListener('beforeunload', () => stopSession(true));
document.addEventListener('visibilitychange', () => {
  if (document.hidden && active) stopSession(false);
});
startWarm(); // keep the backend hot so the first session starts quickly
startAgentWatch(); // poll the local computer agent without touching the voice path
</script>
